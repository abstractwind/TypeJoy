name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release TypeJoy
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x scripts/build.sh

      - name: Build Application
        run: ./scripts/build.sh

      - name: Package Application Archive
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/TypeJoy.app dist/TypeJoy-macOS.zip
          shasum -a 256 dist/TypeJoy-macOS.zip > dist/TypeJoy-macOS.zip.sha256
          echo "SHA256 Checksum:"
          cat dist/TypeJoy-macOS.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/TypeJoy-macOS.zip
            dist/TypeJoy-macOS.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
